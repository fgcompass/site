<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#082B42">
<title>FG-COMPASS Web App</title>
<meta name="description" content="Rate children's fundamental movement skills with the FG-COMPASS decision trees. Nothing is stored online.">
<link rel="icon" href="../images/brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../images/brand/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../images/brand/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --navy: #10364C; --teal: #398D90; --teal-ink: #24696C; --amber: #F9A73E;
  --ink: #172A38; --muted: #4A5F6E; --paper: #F5F8F9; --alt: #E8F1F2; --card: #fff; --line: #D6E2E6;
  --shadow: 0 8px 24px rgba(16,54,76,.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --navy: #FFFFFF; --teal: #2EC7BC; --teal-ink: #2EC7BC; --amber: #F9A73E;
    --ink: #D1E0E6; --muted: #A4C2CA; --paper: #071F31; --alt: #0B2E45; --card: #103C53; --line: #1E4A62;
    --shadow: 0 8px 24px rgba(0,0,0,.3);
  }
  /* Identity Teal fills get Deep Navy text, not white */
  html .yes, html .chip[aria-pressed="true"], html .btn { color: #082B42; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
h1, h2, h3, .lex { font-family: "Inter", system-ui, sans-serif; font-weight: 800; letter-spacing: -.02em; color: var(--navy); }
button { font: inherit; cursor: pointer; }
a { color: var(--teal-ink); }
.wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }

/* Header: the site's deep navy bar, in both themes */
header {
  position: sticky; top: 0; z-index: 5; color: #D1E0E6; transition: transform .25s ease;
  background: radial-gradient(60% 140% at 100% 0%, rgba(46,199,188,.14), rgba(46,199,188,0) 70%), #082B42;
  border-bottom: 1px solid rgba(153,207,211,.23);
}
.bar { display: flex; align-items: center; gap: .75rem; height: 64px; }
header.away { transform: translateY(-100%); }
@media (max-width: 359px) { .brand img { height: 20px !important; } .brand .app span { font-size: .9rem !important; } }
.brand { flex-shrink: 0; }
@media (prefers-reduced-motion: reduce) { header { transition: none; } }
.brand { display: flex; align-items: center; gap: .9rem; text-decoration: none; color: #fff; min-width: 0; }
.brand img { height: 38px; width: auto; display: block; }
.brand .app { display: flex; flex-direction: column; justify-content: center; padding-left: .9rem; border-left: 1px solid rgba(153,207,211,.3); line-height: 1.15; }
.brand .app span { font-weight: 800; font-size: 1.15rem; letter-spacing: -.02em; color: #fff; white-space: nowrap; }
.brand small { display: block; font-weight: 700; font-size: .68rem; color: #F9A73E; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 2px; }
.spacer { flex: 1; }
.lang { border: 1px solid rgba(153,207,211,.35); background: none; color: #D1E0E6; border-radius: 999px; padding: .25rem .8rem; font-size: .85rem; font-weight: 600; }
.lang:hover { border-color: #2EC7BC; color: #2EC7BC; }
.back { display: inline-flex; align-items: center; gap: .4rem; min-height: 44px; padding: 0 .9rem; border-radius: 999px; background: rgba(46,199,188,.12); border: 1px solid rgba(46,199,188,.45); color: #fff; font-size: .88rem; font-weight: 700; text-decoration: none; white-space: nowrap; }
.back:hover { background: #2EC7BC; border-color: #2EC7BC; color: #082B42; }
.back svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }
@media (max-width: 640px) { .back { padding: 0; width: 40px; min-height: 40px; justify-content: center; } .back .full, .back .short { display: none; } }
@media (min-width: 641px) { .back .short { display: none; } }
/* Rate / Results as a compact segmented control inside the bar */
.tabs { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(209,224,230,.1); border: 1px solid rgba(153,207,211,.22); }
.tab { border: 0; background: none; min-height: 38px !important; padding: 0 .95rem; border-radius: 999px; font-weight: 700; font-size: .9rem; color: #A4C2CA; display: inline-flex; align-items: center; white-space: nowrap; }
.tab:hover { color: #fff; }
.tab[aria-selected="true"] { color: #082B42; background: #2EC7BC; }
.tab svg { display: none; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.count { display: inline-block; min-width: 1.5em; padding: 0 .4em; margin-left: .4rem; border-radius: 999px; background: rgba(209,224,230,.16); color: #D1E0E6; font-size: .78rem; font-weight: 700; text-align: center; }
.tab[aria-selected="true"] .count { background: #082B42; color: #F9A73E; }

main.wrap { padding-top: 2rem; padding-bottom: 4rem; }
.section-label { text-transform: uppercase; letter-spacing: .1em; font-size: .75rem; font-weight: 600; color: var(--teal-ink); margin: 0 0 .5rem; }

/* Skill picker */
.skills { display: grid; gap: .9rem; margin-bottom: 1.25rem; }
.chips { display: flex; flex-wrap: wrap; gap: .45rem; }
.chip { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: .45rem .9rem; font-weight: 500; font-size: .95rem; }
.chip[aria-pressed="true"] { background: var(--teal-ink); border-color: var(--teal-ink); color: #fff; }
.chip .done { margin-left: .35rem; font-size: .75rem; opacity: .8; }

/* Cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 1rem; padding: 1.25rem; box-shadow: var(--shadow); }
.row { display: flex; gap: .75rem; align-items: end; flex-wrap: wrap; }
label { display: block; font-size: .85rem; font-weight: 600; color: var(--muted); margin-bottom: .3rem; }
input[type=text], input[type=date] {
  width: 100%; padding: .65rem .8rem; border: 1px solid var(--line); border-radius: .6rem;
  background: var(--paper); color: var(--ink); font: inherit;
}
.grow { flex: 1 1 220px; }

details.protocol { margin: 1rem 0; background: var(--card); border: 1px solid var(--line); border-radius: 1rem; }
details.protocol summary { padding: .9rem 1.1rem; font-weight: 600; cursor: pointer; color: var(--navy); }
.protocol-body { padding: 0 1.1rem 1.1rem; display: grid; gap: 1rem; }
@media (min-width: 720px) { .protocol-body { grid-template-columns: repeat(3, 1fr); } }
.protocol-body h4 { margin: 0 0 .35rem; font-size: .9rem; font-family: "Inter", sans-serif; color: var(--navy); }
.protocol-body ul { margin: 0; padding-left: 1.1rem; font-size: .92rem; }
.protocol-body li { margin-bottom: .3rem; }

/* Question */
.qcard { margin-top: 1rem; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: .5rem; }
.step { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.who { display: inline-flex; align-items: center; gap: .4rem; max-width: 60%; min-width: 0;
       padding: .3rem .8rem .3rem .45rem; border-radius: 999px; border: 2px solid var(--amber);
       background: rgba(249,167,62,.16); color: var(--ink); font-weight: 700; font-size: .95rem; line-height: 1.2; }
.who svg { flex: 0 0 auto; width: 22px; height: 22px; padding: 3px; border-radius: 50%; background: var(--amber);
           fill: none; stroke: #082B42; stroke-width: 2.2; }
.who b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
.who.pulse { animation: whoPulse 1.1s ease-out 2; }
@keyframes whoPulse { 0% { box-shadow: 0 0 0 0 rgba(249,167,62,.7); } 70% { box-shadow: 0 0 0 12px rgba(249,167,62,0); } 100% { box-shadow: 0 0 0 0 rgba(249,167,62,0); } }
.rtop { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; margin-bottom: .9rem; }
.rtop .who { max-width: 100%; }
@media (prefers-reduced-motion: reduce) { .who.pulse { animation: none; } }
.q { font-family: "Inter", sans-serif; font-size: clamp(1.25rem, 3.5vw, 1.6rem); line-height: 1.35; font-weight: 500; margin: .25rem 0 .5rem; color: var(--navy); }
.hint { font-size: .9rem; color: var(--muted); margin: 0 0 1.1rem; }
.yn { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
.yn button { padding: 1rem; border-radius: .8rem; font-weight: 700; font-size: 1.15rem; border: 2px solid; }
.yes { background: var(--teal-ink); border-color: var(--teal-ink) !important; color: #fff; }
.no { background: transparent; border-color: var(--line) !important; color: var(--ink); }
.yes:active, .no:active { transform: scale(.98); }
.link { background: none; border: 0; color: var(--teal-ink); font-weight: 600; padding: .5rem 0; }

/* Tree */
.tree { display: grid; grid-template-columns: repeat(4, 1fr); gap: .4rem; margin-top: 1.25rem; font-size: .78rem; text-align: center; }
.tree div { border: 1px solid var(--line); background: var(--alt); border-radius: .5rem; padding: .35rem .25rem; color: var(--muted); }
.tree .t1 { grid-column: 1 / -1; }
.tree .t2 { grid-column: span 2; }
.tree .on { background: rgba(36,105,108,.14); border-color: var(--teal); color: var(--ink); }
.tree .lv.on { background: var(--amber); border-color: var(--amber); color: #082B42; font-weight: 700; }

/* Result */
.result { display: flex; gap: 1rem; align-items: flex-start; }
.badge { flex: 0 0 auto; width: 72px; height: 72px; border-radius: 18px; display: grid; place-items: center; background: var(--amber); color: #082B42; font: 700 2.2rem "Inter", sans-serif; }
.result h2 { margin: .1rem 0 .3rem; font-size: 1.35rem; }
.result p { margin: 0; color: var(--muted); }
.answers { margin: 1rem 0 0; padding: .75rem 1rem; background: var(--alt); border-radius: .7rem; font-size: .88rem; }
.answers div { display: flex; justify-content: space-between; gap: 1rem; }
.answers b { color: var(--teal-ink); white-space: nowrap; }
.actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.1rem; }
.btn { border: 2px solid var(--teal-ink); background: var(--teal-ink); color: #fff; padding: .7rem 1.1rem; border-radius: .7rem; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--teal-ink); }
.btn.warn { background: transparent; border-color: var(--line); color: var(--muted); }
.ex { margin-top: 1rem; }
.ex { display: block; width: 100%; padding: 0; border: 0; background: none; }
.ex img { width: 100%; max-height: 180px; object-fit: contain; background: #fff; border-radius: .6rem; border: 1px solid var(--line); padding: .4rem; }

/* Compare levels */
.qfoot { display: flex; justify-content: space-between; align-items: center; gap: .5rem; margin-top: .35rem; }
.qfoot .cmp { margin-left: auto; }
.cmp { display: inline-flex; align-items: center; gap: .4rem; background: none; border: 1px solid var(--line); color: var(--teal-ink);
       border-radius: 999px; padding: .35rem .85rem; font-weight: 600; font-size: .88rem; min-height: 40px; }
.cmp svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }
.cmp:hover { background: var(--alt); }
dialog#cmpDlg { padding: 0; border: 0; background: transparent; max-width: none; max-height: none; width: 100%; height: 100%; margin: 0; }
dialog#cmpDlg::backdrop, dialog#skillDlg::backdrop { background: rgba(10,20,30,.55); }
dialog#skillDlg { padding: 0; border: 0; background: transparent; max-width: none; max-height: none; width: 100%; height: 100%; margin: 0; }
.sk-sheet { max-width: 620px; }
.sk-sheet .skills { margin: 1rem 0 .25rem; }
.skillf { flex: 0 0 auto; display: grid; gap: .35rem; }
.skillf .lbl, .who-card label { font-size: .85rem; font-weight: 600; color: var(--muted); }
.skbtn { display: inline-flex; align-items: center; gap: .5rem; min-height: 46px; padding: 0 .8rem 0 1rem; border-radius: .7rem; border: 1.5px solid var(--teal-ink); background: var(--card); color: var(--navy); font-weight: 700; font-size: .98rem; white-space: nowrap; }
.skbtn:hover { background: var(--alt); }
.skbtn .done { font-size: .75rem; font-weight: 700; color: var(--teal-ink); }
.skbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 960px; max-height: 92vh; overflow: auto;
         background: var(--card); color: var(--ink); border-radius: 1.1rem 1.1rem 0 0; padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom));
         box-shadow: 0 -10px 40px rgba(0,0,0,.25); animation: up .22s ease; }
@keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
.sheet-head h2 { margin: .1rem 0 0; font-size: 1.2rem; }
.x { border: 0; background: var(--alt); color: var(--ink); width: 40px; height: 40px; border-radius: 50%; font-size: 1.5rem; line-height: 1; flex: 0 0 auto; }
.pills { display: flex; gap: .4rem; margin: .8rem 0; }
.pills button { flex: 1; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: .6rem; padding: .45rem .3rem; font-weight: 600; font-size: .85rem; min-height: 40px; }
.pills button[aria-selected="true"] { background: var(--amber); border-color: var(--amber); color: #082B42; }
.slides { display: flex; gap: .75rem; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.slides::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; scroll-snap-align: start; margin: 0; }
.slide .pic { background: #fff; border: 1px solid var(--line); border-radius: .7rem; aspect-ratio: 2500 / 1932; display: grid; place-items: center; overflow: hidden; }
.slide .pic img { width: 100%; height: 100%; object-fit: contain; }
.slide .pic span { color: #8796a2; font-size: .9rem; }
.slide.cur .pic { border-color: var(--teal); box-shadow: 0 0 0 2px var(--teal) inset; }
.slide figcaption { padding: .6rem .1rem 0; font-size: .92rem; color: var(--muted); }
.slide figcaption strong { display: block; color: var(--navy); font-family: "Inter", sans-serif; font-size: 1rem; }
.slide .you { display: inline-block; margin-left: .4rem; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--teal-ink); }
@media (min-width: 760px) {
  .sheet { top: 50%; bottom: auto; transform: translateY(-50%); border-radius: 1.1rem; padding: 1.4rem; animation: none; width: calc(100% - 48px); }
  .pills { display: none; }
  .slides { display: grid; grid-template-columns: repeat(4, 1fr); overflow: visible; }
  .slide { flex: none; }
  .slide figcaption { font-size: .85rem; }
}

/* Results */
.empty { text-align: center; padding: 2.5rem 1rem; color: var(--muted); }
.dist { display: grid; grid-template-columns: repeat(4, 1fr); gap: .6rem; margin: 1rem 0; }
.dist div { background: var(--card); border: 1px solid var(--line); border-radius: .8rem; padding: .7rem; }
.dist strong { display: block; font: 700 1.6rem "Inter", sans-serif; color: var(--teal-ink); }
.dist span { font-size: .8rem; color: var(--muted); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: .8rem; background: var(--card); }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { padding: .55rem .7rem; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--alt); }
td.lvl { font-weight: 700; text-align: center; }
td.lvl span { display: inline-block; min-width: 1.8em; border-radius: .4rem; background: var(--amber); color: #082B42; }
.note { font-size: .85rem; color: var(--muted); margin-top: 1rem; }
.meta { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin-bottom: 1rem; }
[hidden] { display: none !important; }
button, .chip, .tab { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.chip, .tab, .btn, .link, .lang { min-height: 44px; }
.yn button { min-height: 64px; }
.bt-res.show { animation: pop .25s ease; }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
#qText { transition: opacity .15s ease; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

/* ---- Phones ---- */
@media (max-width: 640px) {
  .wrap { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
  .bar { height: 56px; gap: .5rem; }
  .brand img { height: 24px; }
  /* phone: app-style top bar plus a bottom tab bar */
  .bar { height: 54px; }
  .brand .app small { display: none; }
  body { padding-bottom: calc(68px + env(safe-area-inset-bottom)); }
  header .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
    padding: 6px 10px calc(6px + env(safe-area-inset-bottom)); border-radius: 0; border: 0; border-top: 1px solid rgba(153,207,211,.25);
    background: #082B42; box-shadow: 0 -6px 20px rgba(8,43,66,.25); }
  .tab { position: relative; flex-direction: column; justify-content: center; gap: 2px; min-height: 54px !important; border-radius: 14px; padding: 0; font-size: .72rem; letter-spacing: .01em; }
  .tab svg { display: block; }
  .tab[aria-selected="true"] { background: rgba(46,199,188,.14); color: #2EC7BC; }
  .tab .count { position: absolute; top: 5px; left: calc(50% + 6px); margin: 0; min-width: 18px; font-size: .68rem; line-height: 18px; padding: 0 5px; background: #F9A73E; color: #082B42; }
  .tab[aria-selected="true"] .count { background: #F9A73E; color: #082B42; }
  .brand, .brand .app { gap: .6rem; }
  .brand .app { padding-left: .6rem; }
  .brand .app span { font-size: 1rem; }
  main.wrap { padding-top: 1.1rem; padding-bottom: calc(2rem + env(safe-area-inset-bottom)); }
  /* Phone order: skills, child, question, then setup/instructions */
  #rateView { display: flex; flex-direction: column; }
  .who-card { order: 2; } #btCard { order: 3; } #protocol { order: 4; }
  .who-card .row { flex-wrap: nowrap; gap: .5rem; align-items: flex-start; }
  .who-card .grow { flex: 1 1 auto; min-width: 0; }
  .skillf .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .skbtn { min-height: 44px; padding: 0 .55rem 0 .75rem; font-size: .9rem; max-width: 46vw; }
  .skbtn .nm { overflow: hidden; text-overflow: ellipsis; }
  .who-card label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .who-card input { padding: .55rem .75rem; }
  .qhead { flex-direction: column-reverse; align-items: flex-start; gap: .1rem; }
  .qhead .who { max-width: 100%; margin-bottom: .45rem; }
  .card { padding: 1rem; border-radius: .9rem; }
  .card.who-card { padding: .6rem; }
  details.protocol { margin: .7rem 0 0; }
  details.protocol summary { padding: .75rem 1rem; font-size: .95rem; }
  .qcard { margin-top: .7rem; scroll-margin-top: 110px; }
  .q { font-size: 1.2rem; margin: .1rem 0 .4rem; }
  .tree { margin-top: .9rem; }
  .hint { font-size: .85rem; margin-bottom: .9rem; }
  .result { gap: .8rem; }
  .badge { width: 60px; height: 60px; font-size: 1.9rem; border-radius: 14px; }
  .result h2 { font-size: 1.2rem; }
  .actions .btn { flex: 1 1 auto; }
  .dist { grid-template-columns: repeat(2, 1fr); }
  .meta { grid-template-columns: 1fr; }
  /* All ratings as stacked rows instead of a wide table */
  #allTable thead { display: none; }
  #allTable tr { display: grid; grid-template-columns: 1fr auto; gap: .1rem .75rem; padding: .6rem .8rem; border-bottom: 1px solid var(--line); }
  #allTable td { border: 0; padding: 0; white-space: normal; }
  #allTable td:nth-child(1) { grid-column: 1; font-size: .78rem; color: var(--muted); }
  #allTable td:nth-child(2) { grid-column: 1; font-weight: 600; }
  #allTable td:nth-child(3) { grid-column: 1; font-size: .9rem; color: var(--muted); }
  #allTable td:nth-child(4) { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-size: 1.1rem; }
  #allTable td:nth-child(5) { grid-column: 2; grid-row: 3; text-align: right; }
  #allTable td:nth-child(5) .link { min-height: 0; padding: 0; font-size: .85rem; }
}
@media (max-width: 360px) {
  .yn { gap: .5rem; }
  .q { font-size: 1.15rem; }
  .tree { font-size: .7rem; }
}

@media print {
  header .tabs, header .lang, header .back, .actions, .meta input, #rateView, .no-print, dialog { display: none !important; }
  header { position: static; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #resultsView { display: block !important; }
  body { background: #fff; }
}

/* ===== Option B: whole decision tree at once (review prototype) ===== */
.bt { padding: 1rem; }
.bt-top { display: flex; justify-content: space-between; align-items: center; gap: .75rem; margin-bottom: .75rem; flex-wrap: wrap; }
.bt-grid { --G: .5rem; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 var(--G); }
.bt-low, .bt-up { align-self: stretch; }

.bt-yn { display: grid; grid-template-columns: 1fr 1fr; gap: 0 var(--G); margin-inline: calc(-1 * var(--np) - 1.5px); }

.bt-yn button { display: flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 .5rem; margin: 0; line-height: 1; border-radius: .7rem; font-weight: 700; font-size: 1rem; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); text-align: center; }

.bt-edges { grid-column: 1 / -1; height: 22px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 var(--G); }

.bt-edges .st::before { content: ""; position: absolute; left: 50%; top: -.95rem; bottom: 0; width: 2px; margin-left: -1px; background: var(--line); border-radius: 2px; }
.bt-edges .st.on::before { width: 3px; margin-left: -1.5px; background: var(--teal-ink); }
.bt-leaf { border: 1.5px solid var(--line); background: var(--card); border-radius: .75rem; overflow: hidden; display: grid; grid-template-rows: auto auto; transition: opacity .2s ease, border-color .2s ease, transform .2s ease; min-width: 0; }
.bt-leaf .im { background: #fff; aspect-ratio: 4 / 3; display: grid; place-items: center; border-bottom: 1px solid var(--line); cursor: zoom-in; padding: 0; border-width: 0 0 1px; width: 100%; }
.bt-leaf .im img { width: 100%; height: 100%; object-fit: contain; display: block; }
.bt-leaf .im i { font-style: normal; font-size: .72rem; color: #7C919E; padding: .4rem; text-align: center; }
.bt-leaf .nm { padding: .4rem .45rem .5rem; display: flex; align-items: center; gap: .4rem; min-width: 0; }
.bt-leaf .nm b { flex: none; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: .8rem; background: var(--alt); color: var(--ink); }
.bt-leaf .nm span { font-size: .78rem; font-weight: 700; color: var(--navy); line-height: 1.15; min-width: 0; }
.bt-leaf.dim { opacity: .38; }
.bt-leaf.hit { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(249,167,62,.35); transform: translateY(-2px); opacity: 1; }
.bt-leaf.hit .nm b { background: var(--amber); color: #082B42; }
.bt-res { margin-top: .9rem; display: none; gap: .75rem; align-items: center; padding: .75rem .9rem; border-radius: .85rem; background: rgba(249,167,62,.14); border: 1.5px solid var(--amber); }
.bt-res.show { display: flex; flex-wrap: wrap; }

.bt-res h3 { margin: 0; font-size: 1.05rem; }

.bt-res .acts button.go { background: var(--teal-ink); border-color: var(--teal-ink); color: #fff; }
@media (prefers-color-scheme: dark) { html .bt-yn button.picked, html .bt-res .acts button.go { color: #082B42; } }
@media (max-width: 640px) {
  .bt { padding: .8rem; }
  .bt-grid { --G: .35rem; }

}

/* ---------- name or ID required before rating ---------- */
.who-card .need { margin: .4rem 0 0; font-size: .85rem; font-weight: 600; color: var(--muted); }
.who-card.missing .need { color: #B4541A; font-weight: 700; }

.bt-hint { display: flex; gap: .7rem; align-items: flex-start; margin: 0 0 .9rem; padding: .7rem .9rem; border-radius: .8rem;
  background: rgba(249,167,62,.14); border: 1.5px solid var(--amber); color: var(--ink); animation: hintGlow 2.6s ease-in-out infinite; }

@keyframes hintGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(249,167,62,.0), 0 0 10px rgba(249,167,62,.25); } 50% { box-shadow: 0 0 0 4px rgba(249,167,62,.22), 0 0 22px rgba(249,167,62,.55); } }

@media (prefers-color-scheme: dark) { html .bt-hint { background: rgba(249,167,62,.12); } html .bt-hint svg { stroke: #F9A73E; } html .bt-hint b { color: #fff; } }
@media print { .bt-hint { animation: none; box-shadow: none; } }
@media (prefers-color-scheme: dark) { html .who-card.missing .need { color: #F9A73E; } }
/* ---------- guided tour ---------- */
.bt-tourbtn { display: inline-flex; align-items: center; gap: .35rem; min-height: 36px; padding: .35rem .8rem; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); color: var(--teal-ink); font: 700 .82rem/1 "Inter", sans-serif; cursor: pointer; }
.bt-tourbtn:hover { border-color: var(--teal-ink); }
.bt-tourbtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
.bt-acts { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }

.tour-tip[data-side="below"]::before { top: -7px; } .tour-tip[data-side="above"]::before { bottom: -7px; }
.tour-tip .tk { font: 800 .68rem/1 "Inter", sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #2EC7BC; margin-bottom: .45rem; display: flex; justify-content: space-between; }

<body>


<header>
  <div class="wrap bar">
    <a class="brand" href="../index.html" id="homeLink">
      <img src="../images/brand/fg-compass-horizontal-dark.svg" alt="FG-COMPASS">

    <div class="spacer"></div>
    <div class="tabs" role="tablist">

    </div>
    <a class="back" href="../index.html" id="backLink"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg><span class="full" id="tBackFull">Back to site</span><span class="short" id="tBackShort">Site</span></a>
    <button class="lang" id="langBtn" type="button" aria-label="Português">PT-BR</button>
  </div>
</header>

<main class="wrap">
  <!-- ============ RATE ============ -->
  <section id="rateView" role="tabpanel" aria-labelledby="tabRate">
    <div class="card who-card">
      <div class="row">
        <div class="skillf"><span class="lbl" id="tSkill"></span><div id="skillPicker"></div></div>
        <div class="grow">
          <label for="performer" id="tPerformer"></label>
          <input type="text" id="performer" autocomplete="off" required aria-describedby="tNeed">
        </div>
      </div>
      <p class="need" id="tNeed"></p>
    </div>

    <details class="protocol" id="protocol">
      <summary id="tProtocol"></summary>
      <div class="protocol-body">
        <div><h4 id="tSetup"></h4><ul id="pSetup"></ul></div>
        <div><h4 id="tSay"></h4><ul id="pSay"></ul></div>
        <div><h4 id="tNotes"></h4><ul id="pNotes"></ul></div>
      </div>
    </details>

    <div class="card bt" id="btCard" aria-live="polite">
      <div class="bt-top">
        <span class="step" id="btStep"></span>
        <span class="bt-acts"><button type="button" class="bt-tourbtn" id="btTour"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 9l5 3-5 3z"/></svg><span id="tTour"></span></button>
        <span class="who" id="btWho"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><b id="btWhoName"></b></span></span>
      </div>
      <div class="bt-hint" role="note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <p><b id="tHintTitle"></b> <span id="tHint"></span></p></div>
      <div class="bt-practice" id="btPractice"></div>
      <div class="bt-grid" id="btGrid"></div>
      <div class="bt-res" id="btRes">
        <div class="lvl-b badge" id="btBadge" style="width:48px;height:48px;font-size:1.5rem;border-radius:12px"></div>
        <div class="txt"><h3 id="btTitle"></h3><p id="btDesc"></p></div>
        <div class="acts"><button type="button" id="btRedo"></button><button type="button" class="go" id="btNext"></button></div>
      </div>
    </div>
</section>

  <!-- ============ RESULTS ============ -->
  <section id="resultsView" role="tabpanel" aria-labelledby="tabResults" hidden>
    <h1 style="margin:.2rem 0 1rem;font-size:1.5rem" id="tResultsTitle"></h1>
    <div class="meta">
      <div><label for="observer" id="tObserver"></label><input type="text" id="observer" autocomplete="off"></div>
      <div><label for="location" id="tLocation"></label><input type="text" id="location" autocomplete="off"></div>
      <div><label for="date" id="tDate"></label><input type="date" id="date"></div>
    </div>
    <div id="resultsBody"></div>
    <div class="actions" id="resultsActions">
      <button class="btn" type="button" id="btnCsv"></button>
      <button class="btn ghost" type="button" id="btnPrint"></button>
      <button class="btn warn" type="button" id="btnClear"></button>
    </div>
    <p class="note" id="tPrivacy"></p>
  </section>
</main>

<dialog id="skillDlg" aria-labelledby="tSkillTitle">
  <div class="sheet sk-sheet">
    <div class="sheet-head"><h2 id="tSkillTitle"></h2><button class="x" type="button" id="skillClose" aria-label="Close">&times;</button></div>
    <div class="skills" id="skillList"></div>
  </div>
</dialog>

  </div>
</dialog>

<script src="skills.js"></script>
<script>

      compare: "Compare levels", compareTitle: "What each level looks like", soon: "Illustration coming soon", yours: "This rating", close: "Close",
      resultsTitle: "Session results", observer: "Rater", location: "Class or location", date: "Date",
      csv: "Download CSV", print: "Print", clear: "Clear results",

      empty: "No ratings yet. Rate a child and the result will show up here.",
      byChild: "By child", allRatings: "All ratings", child: "Child", skill: "Skill", level: "Level", time: "Time",
      remove: "Remove",
      privacy: "Nothing is saved online or in your browser. Results disappear when you close or reload this page, so download the CSV first if you need it.",
      leave: "Your results will be lost.", homeTitle: "FG-COMPASS site", backFull: "Back to site", backShort: "Site", qLangNote: ""
    },
    pt: {

      performer: "Criança (nome ou código)", performerPh: "Criança",

      yes: "Sim", no: "Não", back: "Voltar à pergunta 1",

      next: "Próxima criança", redo: "Desfazer", tour: "Fazer o tour", practice: "Modo de prática. Nada do que você fizer no tour é registrado.", needName: "Digite primeiro o nome ou código da criança. A avaliação é liberada depois disso.", needNameShort: "Cada avaliação é salva com este nome.", noName: "Sem nome", example: "Ilustração de exemplo",
      compare: "Comparar níveis", compareTitle: "Como é cada nível", soon: "Ilustração em breve", yours: "Esta avaliação", close: "Fechar",
      resultsTitle: "Resultados da sessão", observer: "Avaliador", location: "Turma ou local", date: "Data",

      clearConfirm: "Apagar todos os resultados desta sessão?",
      empty: "Nenhuma avaliação ainda. Avalie uma criança e o resultado aparecerá aqui.",
      byChild: "Por criança", allRatings: "Todas as avaliações", child: "Criança", skill: "Habilidade", level: "Nível", time: "Hora",
      remove: "Remover",
      privacy: "Nada é salvo on-line nem no navegador. Os resultados somem ao fechar ou recarregar a página; baixe o CSV antes, se precisar.",
      leave: "Seus resultados serão perdidos.", homeTitle: "Site do FG-COMPASS", backFull: "Voltar ao site", backShort: "Site",
      qLangNote: "As perguntas e os protocolos estão em inglês até a publicação da versão oficial em português."
    }
  };

  var $ = function (id) { return document.getElementById(id); };
  // Portuguese is turned off until the validated Portuguese wording of the decision trees
  // is added to skills.js. Set PT_ENABLED to true to show the language switch again.
  var PT_ENABLED = false;
  var params = new URLSearchParams(location.search);

  if (!PT_ENABLED) $("langBtn").hidden = true;
  var skill = SK.find(function (s) { return s.id === params.get("skill"); }) || SK[0];
  var results = [], counter = 1;
  var t = function (k) { return T[lang][k]; };
  var txt = function (v) { return typeof v === "string" ? v : (v[lang] || v.en); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };

  function performerName() { return $("performer").value.trim() || (t("performerPh") + " " + counter); }

  /* ---------- static text ---------- */
  function applyLang() {
    document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
    $("tAppName").textContent = t("appName"); $("tAppSub").textContent = t("appSub");

    $("skillList").innerHTML = html;
    var n = count(skill.id);
    $("skillPicker").innerHTML = '<button type="button" class="skbtn" id="skillBtn" aria-haspopup="dialog"><span class="nm">' + esc(txt(skill.name)) + "</span>" +
      (n ? '<span class="done">✓' + n + "</span>" : "") + '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>';
  }

  function renderProtocol() {
    var li = function (a) { return a.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join(""); };
    $("pSetup").innerHTML = li(skill.setup); $("pSay").innerHTML = li(skill.say); $("pNotes").innerHTML = li(skill.notes);
    $("tProtocol").textContent = t("protocol") + " · " + txt(skill.name);
  }

  function renderQuestion() {
    if (!bt || bt.skill !== skill.id) bt = { q1: null, q2: null, level: null, skill: skill.id };
    renderB();
  }

  // Brief ring around the child's name so the rater notices who is being rated.
  function pulse(id) {
    var el = $(id); el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse");
  }

  /* ---------- a child's name or ID is required before rating ---------- */
  function hasName() { return $("performer").value.trim() !== ""; }
  function nameState(warn) {
    var card = document.querySelector(".who-card"), ok = hasName();
    document.body.classList.toggle("need-name", !ok);
    if (ok || !warn) card.classList.remove("missing");
    if (warn && !ok) card.classList.add("missing");
    $("tNeed").textContent = ok ? t("needNameShort") : t("needName");
  }
  function needName() {
    if (hasName() || tour) return false;
    nameState(true);
    var el = $("performer"), head = document.querySelector("header");
    var top = el.getBoundingClientRect().top - head.getBoundingClientRect().height - 24;
    if (top < 0 || top > window.innerHeight * .6) window.scrollBy({ top: top, behavior: "smooth" });
    el.focus({ preventScroll: true });
    return true;
  }

  /* ---------- results ---------- */
  function renderResults() {
    var body = $("resultsBody");
    $("resultsActions").hidden = !results.length;
    if (!results.length) { body.innerHTML = '<div class="empty card">' + esc(t("empty")) + "</div>"; return; }
    var counts = [0, 0, 0, 0];
    results.forEach(function (r) { counts[r.level - 1]++; });
    var html = '<div class="dist">' + counts.map(function (c, i) {
      return "<div><strong>" + c + "</strong><span>" + esc(t("levelWord")) + " " + (i + 1) + " · " + esc(t("levelNames")[i]) + "</span></div>";
    }).join("") + "</div>";

    // Matrix: children x skills (latest rating wins)
    var kids = [], used = [];
    results.forEach(function (r) {
      if (kids.indexOf(r.performer) < 0) kids.push(r.performer);
      if (used.indexOf(r.skill) < 0) used.push(r.skill);
    });
    var cols = SK.filter(function (s) { return used.indexOf(s.id) > -1; });
    html += '<p class="section-label">' + esc(t("byChild")) + '</p><div class="tablewrap"><table><thead><tr><th>' + esc(t("child")) + "</th>" +
      cols.map(function (s) { return "<th>" + esc(txt(s.name)) + "</th>"; }).join("") + "</tr></thead><tbody>";
    kids.forEach(function (k) {
      html += "<tr><td>" + esc(k) + "</td>" + cols.map(function (s) {
        var r = results.filter(function (x) { return x.performer === k && x.skill === s.id; }).pop();
        return '<td class="lvl">' + (r ? "<span>" + r.level + "</span>" : "–") + "</td>";
      }).join("") + "</tr>";
    });
    html += "</tbody></table></div>";

    // All ratings
    html += '<p class="section-label" style="margin-top:1.25rem">' + esc(t("allRatings")) + '</p><div class="tablewrap"><table id="allTable"><thead><tr><th>' +
      [t("time"), t("child"), t("skill"), t("level"), ""].map(esc).join("</th><th>") + "</th></tr></thead><tbody>";
    results.slice().reverse().forEach(function (r) {
      var i = results.indexOf(r), s = SK.find(function (x) { return x.id === r.skill; });
      html += "<tr><td>" + r.time.toLocaleTimeString(lang === "pt" ? "pt-BR" : "en-US", { hour: "2-digit", minute: "2-digit" }) +
        "</td><td>" + esc(r.performer) + "</td><td>" + esc(txt(s.name)) + '</td><td class="lvl"><span>' + r.level +
        '</span></td><td class="no-print"><button class="link" type="button" data-del="' + i + '">' + esc(t("remove")) + "</button></td></tr>";
    });
    html += "</tbody></table></div>";
    body.innerHTML = html;
  }

  function csv() {
    var head = ["observer", "location", "date", "performer", "skill", "level", "level_name", "q1_answer", "q2_answer", "time"];
    var q = function (v) { v = String(v == null ? "" : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var rows = results.map(function (r) {
      return [$("observer").value, $("location").value, $("date").value, r.performer, r.skill, r.level,
        T.en.levelNames[r.level - 1], r.q1 ? "YES" : "NO", r.q2 ? "YES" : "NO", r.time.toISOString()].map(q).join(",");
    });
    var blob = new Blob(["﻿" + head.join(",") + "\n" + rows.join("\n") + "\n"], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "fgcompass-results" + ($("date").value ? "-" + $("date").value : "") + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  function showTab(which) {
    var r = which === "rate";
    $("tabRate").setAttribute("aria-selected", r); $("tabResults").setAttribute("aria-selected", !r);
    $("rateView").hidden = !r; $("resultsView").hidden = r;
    window.scrollTo(0, 0);
  }


  /* ---------- compare levels ---------- */
  function hasImg(s, l) { return !(s.noImg && s.noImg.indexOf(l) > -1); }
  function imgSrc(s, l) { return "img/" + s.id + "-l" + l + ".jpg"; }
  var dlg = $("cmpDlg"), opener = null;
  function openCompare(focusLevel) {
    var names = t("levelNames"), lw = t("levelWord");
    $("cmpSkill").textContent = txt(skill.name);
    $("cmpTitle").textContent = t("compareTitle");
    $("cmpPills").innerHTML = [1, 2, 3, 4].map(function (l) {
      return '<button type="button" role="tab" data-go="' + l + '">' + lw + " " + l + "</button>";
    }).join("");
    $("cmpSlides").innerHTML = [1, 2, 3, 4].map(function (l) {
      var pic = hasImg(skill, l)
        ? '<img src="' + imgSrc(skill, l) + '" alt="' + esc(txt(skill.name) + ", " + lw + " " + l) + '" loading="lazy">'
        : "<span>" + esc(t("soon")) + "</span>";
      var you = focusLevel === l && bt.level === l ? '<span class="you">' + esc(t("yours")) + "</span>" : "";
      return '<figure class="slide' + (focusLevel === l && bt.level === l ? " cur" : "") + '" id="slide' + l + '"><div class="pic">' + pic +
        "</div><figcaption><strong>" + lw + " " + l + " · " + esc(names[l - 1]) + you + "</strong>" + esc(skill.levels[l - 1]) + "</figcaption></figure>";
    }).join("");
    opener = document.activeElement;
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
    goSlide(focusLevel || 1, true);
    $("cmpClose").focus();
  }
  function goSlide(l, instant) {
    var el = $("slide" + l), box = $("cmpSlides");
    if (el && box.scrollWidth > box.clientWidth) box.scrollTo({ left: el.offsetLeft - box.offsetLeft, behavior: instant ? "auto" : "smooth" });
    markPill(l);
  }
  function markPill(l) {
    $("cmpPills").querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-selected", String(+b.dataset.go === l)); });
  }
  function closeCompare() { if (dlg.close) dlg.close(); else dlg.removeAttribute("open"); }
  dlg.addEventListener("close", function () { if (opener && opener.focus) opener.focus(); });
  dlg.addEventListener("click", function (e) { if (e.target === dlg) closeCompare(); });
  $("cmpClose").addEventListener("click", closeCompare);
  $("cmpPills").addEventListener("click", function (e) { var b = e.target.closest("[data-go]"); if (b) goSlide(+b.dataset.go); });
  $("cmpSlides").addEventListener("scroll", function () {
    var box = this, w = box.clientWidth; if (!w) return;
    markPill(Math.min(4, Math.round(box.scrollLeft / (w + 12)) + 1));
  }, { passive: true });


  /* ---------- Option B: whole tree at once ---------- */
  var bt = { q1: null, q2: null, level: null };
  function btLevel() { if (bt.q1 === null || bt.q2 === null) return null; return bt.q1 ? (bt.q2 ? 4 : 3) : (bt.q2 ? 1 : 2); }
  function renderB() {
    var lw = t("levelWord"), names = t("levelNames"), lv = btLevel();
    $("btStep").textContent = txt(skill.name);
    $("btWhoName").textContent = hasName() ? performerName() : t("noName");
    var side = bt.q1 === null ? null : (bt.q1 ? "up" : "low");
    function node(key, cls, label) {
      var state = key === "q1" ? (bt.q1 === null ? "active" : "") :
        (side === null ? "dim" : side === key ? (bt.q2 === null ? "active" : "") : "dim");
      var val = key === "q1" ? bt.q1 : (side === key ? bt.q2 : null);
      var btn = function (a) { return '<button type="button" data-k="' + key + '" data-a="' + (a ? 1 : 0) + '" class="' + (val === a ? "picked" : "") + '">' + esc(t(a ? "yes" : "no")) + '</button>'; };
      var order = key === "low" ? [true, false] : [false, true];  /* each button sits over the branch it leads to */
      return '<div class="bt-node ' + cls + ' ' + state + '"><span class="k">' + label + '</span><p>' + esc(skill[key]) + '</p>' +
        '<div class="bt-yn">' + btn(order[0]) + btn(order[1]) + '</div></div>';
    }
    function edges(top) {
      var st = function (on, half) { return '<span class="st' + (half ? " half" : "") + (on ? " on" : "") + '"></span>'; };
      if (top) return '<div class="bt-edges" aria-hidden="true">' + st(bt.q1 === false, 1) + st(bt.q1 === true, 1) + '</div>';
      return '<div class="bt-edges" aria-hidden="true">' + [1, 2, 3, 4].map(function (l) { return st(lv === l); }).join("") + '</div>';
    }
    var leaves = [1, 2, 3, 4].map(function (l) {
      var under = l <= 2 ? "low" : "up";
      var st = lv ? (lv === l ? "hit" : "dim") : (side && side !== under ? "dim" : "");
      var im = hasImg(skill, l) ? '<img src="' + imgSrc(skill, l) + '" alt="' + esc(txt(skill.name) + ", " + lw + " " + l) + '" loading="lazy">' : "<i>No illustration yet</i>";
      return '<div class="bt-leaf ' + st + '"><button type="button" class="im" data-cmp="' + l + '" aria-label="' + esc(lw + " " + l) + '">' + im + '</button>' +
        '<div class="nm"><b>' + l + '</b><span>' + esc(names[l - 1]) + '</span></div></div>';
    }).join("");
    $("btGrid").innerHTML = node("q1", "bt-q1", t("q") + " 1") + edges(true) +
      node("low", "bt-low", t("q") + " 2 · " + t("no")) + node("up", "bt-up", t("q") + " 2 · " + t("yes")) + edges(false) + leaves;
    var r = $("btRes");
    if (lv) {
      r.classList.add("show"); $("btBadge").textContent = lv;
      $("btTitle").textContent = lw + " " + lv + " · " + names[lv - 1]; $("btDesc").textContent = skill.levels[lv - 1];
    } else r.classList.remove("show");
  }
  function resetB() { bt = { q1: null, q2: null, level: null, skill: skill.id }; renderB(); }
  $("btGrid").addEventListener("click", function (e) {
    var c = e.target.closest("[data-cmp]");
    if (c) { if (typeof openCompare === "function") openCompare(+c.dataset.cmp); return; }
    var b = e.target.closest("[data-k]"); if (!b) return;
    if (needName()) return;
    var yes = b.dataset.a === "1";
    if (b.dataset.k === "q1") { bt.q1 = yes; bt.q2 = null; }
    else { bt.q2 = yes; }
    var lv = btLevel();
    if (lv && bt.level === null) {
      bt.level = lv;
      results.push({ performer: performerName(), skill: skill.id, level: lv, q1: bt.q1, q2: bt.q2, time: new Date() });
      renderTabs(); renderPicker(); renderResults();
    } else if (lv && bt.level !== null && lv !== bt.level) {
      bt.level = lv; var last = results[results.length - 1]; if (last) { last.level = lv; last.q1 = bt.q1; last.q2 = bt.q2; }
      renderTabs(); renderPicker(); renderResults();
    } else if (!lv && bt.level !== null) {
      results.pop(); bt.level = null; renderTabs(); renderPicker(); renderResults();
    }
    renderB();
  });
  $("btRedo").addEventListener("click", function () { if (bt.level !== null) results.pop(); renderTabs(); renderPicker(); renderResults(); resetB(); });
  $("btNext").addEventListener("click", function () { counter++; $("performer").value = ""; nameState(); resetB(); var el = $("performer"); el.scrollIntoView({ block: "center", behavior: "smooth" }); el.focus({ preventScroll: true }); });
  /* ---------- events ---------- */
  var skDlg = $("skillDlg");
  function closeSkills() { if (skDlg.close) skDlg.close(); else skDlg.removeAttribute("open"); }
  $("skillPicker").addEventListener("click", function () { if (skDlg.showModal) skDlg.showModal(); else skDlg.setAttribute("open", ""); });
  $("skillClose").addEventListener("click", closeSkills);
  skDlg.addEventListener("click", function (e) { if (e.target === skDlg) closeSkills(); });
  $("skillList").addEventListener("click", function (e) {
    var b = e.target.closest("[data-skill]"); if (!b) return;
    skill = SK.find(function (s) { return s.id === b.dataset.skill; });
    renderPicker(); renderProtocol(); resetB(); closeSkills();
    var u = new URL(location.href); u.searchParams.set("skill", skill.id); history.replaceState(null, "", u);
  });
  $("performer").addEventListener("input", function () { $("btWhoName").textContent = hasName() ? performerName() : t("noName"); nameState(); });
  $("performer").addEventListener("change", function () { if (hasName()) pulse("btWho"); });
  $("tabRate").addEventListener("click", function () { showTab("rate"); });
  $("tabResults").addEventListener("click", function () { showTab("results"); });
  $("resultsBody").addEventListener("click", function (e) {
    var b = e.target.closest("[data-del]"); if (!b) return;
    results.splice(+b.dataset.del, 1); renderTabs(); renderPicker(); renderResults();
  });
  $("btnCsv").addEventListener("click", csv);
  $("btnPrint").addEventListener("click", function () { window.print(); });
  $("btnClear").addEventListener("click", function () {
    if (window.confirm(t("clearConfirm"))) { results = []; counter = 1; renderTabs(); renderPicker(); renderResults(); }
  });
  $("langBtn").addEventListener("click", function () {
    lang = lang === "en" ? "pt" : "en";
    var u = new URL(location.href); if (lang === "pt") u.searchParams.set("lang", "pt"); else u.searchParams.delete("lang");
    history.replaceState(null, "", u);
    applyLang();
  });
  window.addEventListener("beforeunload", function (e) {
    if (results.length) { e.preventDefault(); e.returnValue = t("leave"); }
  });

  var d = new Date(); $("date").value = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  /* ---------- guided tour ---------- */
  var tour = null, tip = null;
  var TOUR = [
    { el: function () { return document.querySelector("#btCard .bt-hint"); },
      h: "Watch 3 trials first", p: "Have the child perform the skill three times and watch all three before you answer. Tap Yes only if you saw the behavior in at least 2 of the 3 valid trials." },
    { el: function () { return document.querySelector("#btGrid .bt-q1"); }, wait: function () { return bt.q1 !== null; },
      h: "Start with Question 1", p: "Watch the child perform the skill, then answer the first question. Each button sits over the branch it leads to.", d: "Tap Yes or No to try it." },
    { el: function () { return document.querySelector("#btGrid .bt-node.active") || document.querySelector("#btGrid .bt-low, #btGrid .bt-up"); }, wait: function () { return btLevel() !== null; },
      h: "Your answer opens one branch", p: "The other side fades out, so only one question is left. Answer it the same way.", d: "Tap Yes or No on the highlighted question." },
    { el: function () { return document.querySelector("#btGrid .bt-leaf.hit"); },
      h: "That's the level", p: "The line shows the path you took. All four level drawings stay visible, so you can check your call at a glance. Tapping a drawing opens it larger to compare levels side by side." },
    { el: function () { return $("btRes"); },
      h: "Saved for this child", p: "The rating goes on the list straight away. Undo clears it if you misclicked. Next child resets the tree for the next performer." },
    { el: function () { return $("performer"); },
      h: "Name each child first", p: "Type the child's name or ID before you rate. The Yes and No buttons stay locked until you do, so every rating is saved under the right child." },
    { el: function () { return $("tabResults"); },
      h: "Everything collects here", p: "The Results tab lists every rating, ready to download as a spreadsheet or print. Nothing is sent anywhere, it stays on this device." }
  ];
  function tourStart() {
    if (tour) return;
    tour = { i: 0, n: results.length, c: counter, perf: $("performer").value };
    try { localStorage.setItem("fgc-tour-b", "1"); } catch (e) {}
    $("btCard").classList.add("touring");
    tip = document.createElement("div"); tip.className = "tour-tip"; tip.setAttribute("role", "dialog"); tip.setAttribute("aria-live", "polite");
    document.body.appendChild(tip);
    tip.addEventListener("click", function (e) {
      if (e.target.closest(".skip")) tourEnd(); else if (e.target.closest(".nx")) tourGo(tour.i + 1);
    });
    bt = { q1: null, q2: null, level: null, skill: skill.id }; _renderB();
    tourGo(0);
  }
  function tourGo(i) {
    if (i >= TOUR.length) return tourEnd();
    tour.i = i; tourDraw(true);
  }
  function tourDraw(scroll) {
    if (!tour || !tip) return;
    var st = TOUR[tour.i];
    document.querySelectorAll(".tour-hi").forEach(function (x) { x.classList.remove("tour-hi"); });
    var el = st.el(); if (!el) return;
    el.classList.add("tour-hi");
    var waiting = st.wait && !st.wait(), last = tour.i === TOUR.length - 1;
    tip.innerHTML = '<div class="tk"><span>Quick tour</span><span>' + (tour.i + 1) + " of " + TOUR.length + "</span></div><h4>" + st.h + "</h4><p>" + st.p + "</p>" +
      (waiting ? '<div class="do">' + st.d + "</div>" : "") +
      '<div class="row"><button type="button" class="skip">' + (last ? "Close" : "Skip tour") + '</button><span class="dots">' +
      TOUR.map(function (_, k) { return '<i class="' + (k === tour.i ? "on" : "") + '"></i>'; }).join("") + "</span>" +
      (waiting ? "<span></span>" : '<button type="button" class="nx">' + (last ? "Start rating" : "Next") + "</button>") + "</div>";
    if (scroll && el.scrollIntoView) el.scrollIntoView({ block: "center", behavior: "smooth" });
    tourPlace(); setTimeout(tourPlace, 450);
  }
  function tourPlace() {
    if (!tour) return;
    var el = document.querySelector(".tour-hi"); if (!el) return;
    var r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight, vw = document.documentElement.clientWidth;
    var below = r.bottom + th + 18 < window.innerHeight || r.top < th + 18;
    var left = Math.min(Math.max(16, r.left + r.width / 2 - tw / 2), vw - tw - 16);
    tip.dataset.side = below ? "below" : "above";
    tip.style.left = (left + scrollX) + "px";
    tip.style.top = ((below ? r.bottom + 14 : r.top - th - 14) + scrollY) + "px";
    tip.style.setProperty("--ax", Math.min(Math.max(18, r.left + r.width / 2 - left), tw - 18) + "px");
  }
  function tourEnd() {
    if (!tour) return;
    results.length = tour.n; counter = tour.c; $("performer").value = tour.perf;
    document.querySelectorAll(".tour-hi").forEach(function (x) { x.classList.remove("tour-hi"); });
    tip.remove(); tip = null; tour = null;
    $("btCard").classList.remove("touring");
    renderTabs(); renderPicker(); renderResults(); resetB(); nameState();
    $("performer").focus();
  }
  var _renderB = renderB;
  renderB = function () {
    _renderB();
    if (!tour) return;
    var st = TOUR[tour.i];
    if (st.wait && st.wait()) { tourGo(tour.i + 1); return; }
    if (tour.i === 2 && bt.q1 === null) { tourGo(1); return; }
    tourDraw(false);
  };
  $("btTour").addEventListener("click", tourStart);
  window.addEventListener("resize", tourPlace);
  document.addEventListener("keydown", function (e) { if (tour && e.key === "Escape") tourEnd(); });
  (function () { var seen = "1"; try { seen = localStorage.getItem("fgc-tour-b"); } catch (e) {} if (!seen) setTimeout(tourStart, 600); })();
  /* header slides away while scrolling down and comes back on any scroll up */
  (function () {
    var head = document.querySelector("header"), lastY = window.scrollY, phone = window.matchMedia("(max-width: 640px)");
    window.addEventListener("scroll", function () {
      var y = window.scrollY;
      if (tour || phone.matches || y < 80 || y < lastY - 4 || document.activeElement === $("performer")) head.classList.remove("away");
      else if (y > lastY + 4) head.classList.add("away");
      lastY = y;
    }, { passive: true });
  })();
  applyLang();
})();
</script>
</body>
</html>
